name: Cloudflare Terraform

# The Cloudflare zones of the Anda account (cloudflare/production): plan on a pull
# request, apply on merge to main. The jobs are in the reusable terraform.yml, which
# explains the guards. Nobody applies this root from a laptop.

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - '.github/workflows/cloudflare-terraform.yml'
      - '.github/workflows/terraform.yml'
      - '!**/*.md'
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - '.github/workflows/cloudflare-terraform.yml'
      - '.github/workflows/terraform.yml'
      - '!**/*.md'

# Caps the reusable workflow's token as well.
permissions:
  contents: read

# Never cancelled on main: an apply killed mid-flight leaves the lock object behind
# and the zones half-changed. Pull request runs cancel their superseded plans.
concurrency:
  group: cloudflare-terraform-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  terraform:
    uses: ./.github/workflows/terraform.yml
    with:
      root: cloudflare/production
      fmt-directory: cloudflare
    # Explicit mapping, never `secrets: inherit`: this root gets the Cloudflare token
    # and the state credentials, never the GitHub token. The values are environment
    # secrets of terraform-plan (read-only) and terraform-apply (edit).
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
